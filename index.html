    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How much paint do I need for a room?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Add up the wall area (the room's perimeter times the wall height), subtract doors and windows, multiply by the number of coats, and divide by the paint's coverage in square metres per litre. For a typical 4 by 3.5 metre room with 2.4 metre walls and two coats, that is roughly 5 to 6 litres."
            }
          },
          {
            "@type": "Question",
            "name": "How many square metres does a litre of paint cover?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Around 13 to 16 square metres per litre per coat for interior wall paint on a smooth, previously painted surface. New plaster, render and textured or porous surfaces cover less, down to about 6 square metres per litre for bare brick."
            }
          },
          {
            "@type": "Question",
            "name": "Should I use one coat or two?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Two coats is standard for an even, durable finish. One coat can work when painting a very similar colour over a sound existing coat. Large colour changes, or light over dark, usually need a primer or an extra coat."
            }
          },
          {
            "@type": "Question",
            "name": "Do I subtract doors and windows?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "For a tighter estimate, yes. A standard door is about 1.7 square metres and an average window about 1.4. Leaving them in gives you a built-in safety margin instead."
            }
          }
        ]
      }
    </script>
